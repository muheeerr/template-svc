# Usage:
#   docker compose up -d          → start all services
#   docker compose down           → stop all services
#   docker compose down -v        → stop and delete volumes
#   Mailpit UI: http://localhost:8025
#   Seq UI:     http://localhost:8080
#   PostgreSQL: localhost:5432
#   Redis:      localhost:6379

services:
  postgres:
    image: postgres:17-alpine
    container_name: projectname-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectnameDev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: projectname-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Seq for structured log viewing
  seq:
    image: datalust/seq:latest
    container_name: projectname-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"    # Ingestion API
      - "8080:80"      # Web UI
    volumes:
      - seq-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: projectname-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI at http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 100
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: projectname-otel
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP

volumes:
  postgres-data:
  redis-data:
  seq-data:
  mailpit-data:
