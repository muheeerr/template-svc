apiVersion: v1
kind: Service
metadata:
  name: {{ include "__ProjectName__.fullname" . }}
  labels:
    {{- include "__ProjectName__.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "__ProjectName__.selectorLabels" . | nindent 4 }}
