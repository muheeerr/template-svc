# NOTE: In production, populate via external-secrets or sealed-secrets.
# Do NOT commit real values. Always use --set at deploy time.
apiVersion: v1
kind: Secret
metadata:
  name: {{ (index .Values.secretRefs 0).name }}
  labels:
    {{- include "__ProjectName__.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_KEY:         {{ required "secrets.jwtKey is required" .Values.secrets.jwtKey | b64enc }}
  DBHost:          {{ required "secrets.dbHost is required" .Values.secrets.dbHost | b64enc }}
  SenderEmail:     {{ required "secrets.senderEmail is required" .Values.secrets.senderEmail | b64enc }}
  SenderPassword:  {{ required "secrets.senderPassword is required" .Values.secrets.senderPassword | b64enc }}
  AES_KEY:         {{ required "secrets.aesKey is required" .Values.secrets.aesKey | b64enc }}
